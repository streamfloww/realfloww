<!DOCTYPE html>
<html lang="en" class="dark h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Sphere Mobile - NextGen Social</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#3b82f6',
                            600: '#2563eb',
                            accent: '#8b5cf6'
                        },
                        dark: {
                            bg: '#000000',
                            card: '#121212',
                            surface: '#18181b',
                            border: '#27272a',
                            muted: '#71717a',
                            text: '#f4f4f5'
                        }
                    },
                    keyframes: {
                        heartPop: {
                            '0%': { transform: 'scale(1)' },
                            '50%': { transform: 'scale(1.35)' },
                            '100%': { transform: 'scale(1)' }
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(100%)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'scale(0.97)' },
                            '100%': { opacity: '1', transform: 'scale(1)' }
                        }
                    },
                    animation: {
                        heartPop: 'heartPop 0.35s ease-in-out',
                        slideUp: 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        fadeIn: 'fadeIn 0.2s ease-out forwards'
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Mobile Web App Custom Styling -->
    <style>
        /* Safe Area and Touch Handling */
        body {
            background-color: #000000;
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            overflow: hidden; /* Main scroll handles inner content */
        }

        /* Smooth iOS-style scrollbars */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .glass-header {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background-color: rgba(0, 0, 0, 0.82);
        }

        .glass-bottom {
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background-color: rgba(0, 0, 0, 0.88);
            padding-bottom: env(safe-area-inset-bottom);
        }

        /* Active Navigation Indicator */
        .nav-active {
            color: #3b82f6 !important;
        }
    </style>
</head>
<body class="h-full w-full flex justify-center items-center bg-zinc-950 sm:py-4">

    <!-- MOBILE VIEWPORT CONTAINER -->
    <div class="w-full h-full max-w-md sm:h-[880px] sm:rounded-[40px] sm:border-[8px] sm:border-zinc-800 bg-black flex flex-col relative overflow-hidden shadow-2xl">
        
        <!-- TOP APP BAR -->
        <header class="glass-header sticky top-0 z-30 border-b border-dark-border flex flex-col shrink-0">
            <div class="flex items-center justify-between px-4 pt-3 pb-2">
                <!-- User Profile Avatar (Opens profile modal/toast) -->
                <button onclick="showToast('Profile drawer clicked')" class="relative group">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" 
                         alt="User profile" 
                         class="w-8 h-8 rounded-full object-cover ring-2 ring-brand-500/40">
                    <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full ring-2 ring-black"></span>
                </button>

                <!-- Brand Header -->
                <div class="flex items-center gap-2">
                    <div class="w-7 h-7 rounded-lg bg-gradient-to-tr from-brand-600 via-brand-accent to-pink-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                        <i data-lucide="orbit" class="w-4 h-4"></i>
                    </div>
                    <span class="font-black text-lg tracking-wider bg-gradient-to-r from-white via-zinc-200 to-brand-500 bg-clip-text text-transparent">
                        SPHERE
                    </span>
                </div>

                <!-- Action Button (Search / Filter) -->
                <button onclick="toggleSearchOverlay()" class="p-2 text-zinc-300 hover:text-white rounded-full transition active:scale-95">
                    <i data-lucide="search" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- FEED CATEGORY TABS -->
            <div id="feed-tab-header" class="flex text-center font-bold text-sm border-t border-dark-border/40">
                <button onclick="setActiveTab('for-you')" id="tab-for-you" class="flex-1 py-2.5 relative text-white transition">
                    For You
                    <div id="tab-indicator" class="absolute bottom-0 left-1/4 -translate-x-1/2 w-8 h-1 bg-brand-500 rounded-full transition-all duration-300"></div>
                </button>
                <button onclick="setActiveTab('following')" id="tab-following" class="flex-1 py-2.5 text-dark-muted transition">
                    Following
                </button>
                <button onclick="setActiveTab('media')" id="tab-media" class="flex-1 py-2.5 text-dark-muted transition flex items-center justify-center gap-1">
                    <i data-lucide="film" class="w-3.5 h-3.5"></i> Video
                </button>
            </div>
        </header>

        <!-- MAIN SCROLLABLE CONTENT AREA -->
        <main id="main-scroll-view" class="flex-1 overflow-y-auto no-scrollbar divide-y divide-dark-border relative">
            <!-- Feed stream dynamically rendered via JS -->
            <div id="feed-container"></div>
        </main>

        <!-- FLOATING ACTION BUTTON (POST CREATOR FAB) -->
        <button onclick="openComposerModal()" 
                class="absolute right-4 bottom-20 z-30 w-14 h-14 bg-gradient-to-tr from-brand-600 to-brand-accent text-white rounded-full flex items-center justify-center shadow-lg shadow-brand-500/30 active:scale-90 transition-transform">
            <i data-lucide="plus" class="w-7 h-7"></i>
        </button>

        <!-- FIXED BOTTOM NAVIGATION BAR -->
        <nav class="glass-bottom border-t border-dark-border z-30 flex justify-around items-center h-16 shrink-0 px-2 select-none">
            <button onclick="switchBottomNav('home')" id="nav-home" class="flex flex-col items-center justify-center w-16 h-full text-brand-500 transition active:scale-95">
                <i data-lucide="home" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium mt-1">Home</span>
            </button>
            <button onclick="switchBottomNav('explore')" id="nav-explore" class="flex flex-col items-center justify-center w-16 h-full text-dark-muted transition active:scale-95">
                <i data-lucide="compass" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium mt-1">Explore</span>
            </button>
            <button onclick="switchBottomNav('notifications')" id="nav-notifications" class="flex flex-col items-center justify-center w-16 h-full text-dark-muted transition relative active:scale-95">
                <div class="relative">
                    <i data-lucide="bell" class="w-6 h-6"></i>
                    <span class="absolute -top-1 -right-1 w-2 h-2 bg-brand-500 rounded-full"></span>
                </div>
                <span class="text-[10px] font-medium mt-1">Activity</span>
            </button>
            <button onclick="switchBottomNav('profile')" id="nav-profile" class="flex flex-col items-center justify-center w-16 h-full text-dark-muted transition active:scale-95">
                <i data-lucide="user" class="w-6 h-6"></i>
                <span class="text-[10px] font-medium mt-1">Profile</span>
            </button>
        </nav>

        <!-- CREATE POST MODAL (BOTTOM SHEET FOR MOBILE) -->
        <div id="composer-modal" class="hidden absolute inset-0 bg-black/80 backdrop-blur-md z-50 flex flex-col justify-end">
            <div class="bg-dark-surface border-t border-dark-border rounded-t-3xl p-4 w-full animate-slideUp flex flex-col max-h-[90%]">
                
                <!-- Modal Header -->
                <div class="flex items-center justify-between pb-3 border-b border-dark-border">
                    <button onclick="closeComposerModal()" class="p-1 text-dark-muted hover:text-white transition">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                    <span class="font-bold text-sm text-white">Create New Post</span>
                    <button onclick="publishPost()" id="modal-post-btn" class="bg-brand-500 hover:bg-brand-600 text-white font-bold px-4 py-1.5 rounded-full text-xs shadow-md shadow-brand-500/20 active:scale-95 transition">
                        Post
                    </button>
                </div>

                <!-- Input Body -->
                <div class="pt-4 flex gap-3 flex-1 overflow-y-auto">
                    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80" alt="Avatar" class="w-10 h-10 rounded-full object-cover ring-1 ring-dark-border">
                    <div class="flex-1 flex flex-col">
                        <textarea id="modal-composer-text" 
                                  rows="3" 
                                  placeholder="What's happening? Share photos or MP4 video clips..." 
                                  class="w-full bg-transparent text-white placeholder-dark-muted text-sm border-none focus:outline-none resize-none leading-relaxed"></textarea>

                        <!-- Media Attachment Preview -->
                        <div id="modal-media-preview" class="hidden relative rounded-xl overflow-hidden my-2 border border-dark-border bg-black">
                            <button onclick="clearMediaAttachment()" class="absolute top-2 right-2 bg-black/70 text-white p-1.5 rounded-full z-10 backdrop-blur-sm">
                                <i data-lucide="x" class="w-4 h-4"></i>
                            </button>
                            <div id="modal-preview-content"></div>
                        </div>
                    </div>
                </div>

                <!-- Hidden Inputs for Files -->
                <input type="file" id="modal-image-input" accept="image/jpeg,image/png,image/webp" class="hidden" onchange="handleFileSelected(event, 'image')">
                <input type="file" id="modal-video-input" accept="video/mp4,video/webm" class="hidden" onchange="handleFileSelected(event, 'video')">

                <!-- Toolbar Bottom Actions -->
                <div class="flex items-center justify-between pt-3 border-t border-dark-border mt-2">
                    <div class="flex items-center gap-2">
                        <button onclick="document.getElementById('modal-image-input').click()" class="p-2 text-brand-500 hover:bg-brand-500/10 rounded-xl transition flex items-center gap-1 text-xs font-semibold">
                            <i data-lucide="image" class="w-5 h-5"></i>
                            <span>Photo</span>
                        </button>
                        <button onclick="document.getElementById('modal-video-input').click()" class="p-2 text-brand-accent hover:bg-brand-accent/10 rounded-xl transition flex items-center gap-1 text-xs font-semibold">
                            <i data-lucide="video" class="w-5 h-5"></i>
                            <span>MP4 Video</span>
                        </button>
                    </div>
                    <span id="char-counter" class="text-xs text-dark-muted">0 / 280</span>
                </div>
            </div>
        </div>

        <!-- SEARCH OVERLAY MODAL -->
        <div id="search-modal" class="hidden absolute inset-0 bg-black z-40 flex flex-col p-4 animate-fadeIn">
            <div class="flex items-center gap-2 pb-3 border-b border-dark-border">
                <div class="flex-1 relative">
                    <i data-lucide="search" class="absolute left-3.5 top-3 w-4 h-4 text-dark-muted"></i>
                    <input type="text" id="mobile-search-input" onkeyup="handleSearch(this.value)" placeholder="Search keywords or #hashtags..." 
                           class="w-full bg-dark-card text-white text-sm rounded-xl pl-10 pr-4 py-2.5 border border-dark-border focus:outline-none focus:border-brand-500">
                </div>
                <button onclick="toggleSearchOverlay()" class="text-xs text-brand-500 font-bold px-2 py-1">Cancel</button>
            </div>
            <div id="search-results" class="flex-1 overflow-y-auto py-3 divide-y divide-dark-border/40">
                <div class="text-xs text-dark-muted py-2">Suggested Trending Topics</div>
                <div onclick="applyHashtagSearch('WebDev')" class="py-2.5 flex justify-between items-center cursor-pointer">
                    <div>
                        <div class="text-sm font-bold text-white">#WebDev</div>
                        <div class="text-[11px] text-dark-muted">24.5K posts</div>
                    </div>
                    <i data-lucide="arrow-up-right" class="w-4 h-4 text-dark-muted"></i>
                </div>
                <div onclick="applyHashtagSearch('MobileDesign')" class="py-2.5 flex justify-between items-center cursor-pointer">
                    <div>
                        <div class="text-sm font-bold text-white">#MobileDesign</div>
                        <div class="text-[11px] text-dark-muted">18.1K posts</div>
                    </div>
                    <i data-lucide="arrow-up-right" class="w-4 h-4 text-dark-muted"></i>
                </div>
            </div>
        </div>

        <!-- TOAST NOTIFICATION OVERLAY -->
        <div id="toast-overlay" class="absolute top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none w-11/12 max-w-xs"></div>

    </div>

    <script>
        // State variables
        let selectedMedia = null; // { type: 'image' | 'video', url: string, file: File }
        let currentFeedTab = 'for-you';
        let currentNavTab = 'home';
        let searchQuery = '';

        // Initial Mobile Data Feed
        let feedPosts = [
            {
                id: 'p1',
                author: {
                    name: 'dev',
                    handle: 'dev',
                    avatar: 'https://cdn.discordapp.com/attachments/1269573734822314036/1553787589390245908/IMG_9390.jpg?ex=6aba84f5&is=6ab93375&hm=c03771ff66da9d26dda9b30f499d2711e3d341e0775fac572a0dddbdd6d37ecd&',
                    verified: true
                },
                content: '267-707-5179',
                timestamp: '8m',
                media: {
                    type: 'image',
                    url: 'https://cdn.discordapp.com/attachments/1269573734822314036/1553787589390245908/IMG_9390.jpg?ex=6aba84f5&is=6ab93375&hm=c03771ff66da9d26dda9b30f499d2711e3d341e0775fac572a0dddbdd6d37ecd&'
                },
                stats: { replies: 5, reposts: 12, likes: 88, views: '1.2K' },
                isLiked: false,
                isReposted: false,
                isBookmarked: false,
                tab: 'for-you'
            },
            {
                id: 'p2',
                author: {
                    name: 'Motion Cinema',
                    handle: 'motion_shorts',
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=120&q=80',
                    verified: true
                },
                content: 'Sample MP4 video stream rendered in native HTML5 player. Double tap or click to interact! 🎬✨ #Cinema',
                timestamp: '42m',
                media: {
                    type: 'video',
                    url: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4'
                },
                stats: { replies: 19, reposts: 44, likes: 310, views: '8.9K' },
                isLiked: true,
                isReposted: false,
                isBookmarked: true,
                tab: 'media'
            },
            {
                id: 'p3',
                author: {
                    name: 'Alex Rivera',
                    handle: 'arivera_ui',
                    avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=120&q=80',
                    verified: false
                },
                content: 'Just launched my new UI kit. Works seamlessly on both iOS and Android browsers! 🚀',
                timestamp: '2h',
                media: null,
                stats: { replies: 2, reposts: 6, likes: 45, views: '620' },
                isLiked: false,
                isReposted: false,
                isBookmarked: false,
                tab: 'following'
            }
        ];

        function handleFileSelected(event, mediaType) {
            const file = event.target.files[0];
            if (!file) return;

            if (mediaType === 'video' && !file.type.includes('mp4') && !file.type.includes('webm')) {
                showToast('Please select a valid MP4 video.');
                return;
            }

            const objectUrl = URL.createObjectURL(file);
            selectedMedia = {
                type: mediaType,
                url: objectUrl,
                file: file
            };

            renderModalMediaPreview();
        }

        function renderModalMediaPreview() {
            const container = document.getElementById('modal-media-preview');
            const content = document.getElementById('modal-preview-content');

            if (!selectedMedia) {
                container.classList.add('hidden');
                content.innerHTML = '';
                return;
            }

            container.classList.remove('hidden');

            if (selectedMedia.type === 'image') {
                content.innerHTML = `<img src="${selectedMedia.url}" class="max-h-60 w-full object-cover rounded-xl">`;
            } else if (selectedMedia.type === 'video') {
                content.innerHTML = `
                    <video controls class="max-h-60 w-full bg-black rounded-xl">
                        <source src="${selectedMedia.url}" type="${selectedMedia.file.type || 'video/mp4'}">
                        Your browser does not support HTML5 video playback.
                    </video>
                `;
            }
            refreshIcons();
        }

        function clearMediaAttachment() {
            if (selectedMedia && selectedMedia.url) {
                URL.revokeObjectURL(selectedMedia.url);
            }
            selectedMedia = null;
            document.getElementById('modal-image-input').value = '';
            document.getElementById('modal-video-input').value = '';
            renderModalMediaPreview();
        }

        function openComposerModal() {
            document.getElementById('composer-modal').classList.remove('hidden');
            document.getElementById('modal-composer-text').focus();
        }

        function closeComposerModal() {
            document.getElementById('composer-modal').classList.add('hidden');
            clearMediaAttachment();
            document.getElementById('modal-composer-text').value = '';
        }

        function publishPost() {
            const textarea = document.getElementById('modal-composer-text');
            const textVal = textarea.value.trim();

            if (!textVal && !selectedMedia) {
                showToast('Add text or media to publish!');
                return;
            }

            const newPost = {
                id: 'p-' + Date.now(),
                author: {
                    name: 'Elena Rostova',
                    handle: 'elena_ui',
                    avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=120&q=80',
                    verified: true
                },
                content: textVal,
                timestamp: 'Just now',
                media: selectedMedia ? { type: selectedMedia.type, url: selectedMedia.url } : null,
                stats: { replies: 0, reposts: 0, likes: 0, views: '1' },
                isLiked: false,
                isReposted: false,
                isBookmarked: false,
                tab: 'for-you'
            };

            feedPosts.unshift(newPost);
            closeComposerModal();
            renderFeed();
            showToast('Post published!');
        }

        function toggleLike(postId) {
            const post = feedPosts.find(p => p.id === postId);
            if (post) {
                post.isLiked = !post.isLiked;
                post.stats.likes += post.isLiked ? 1 : -1;
                renderFeed();
            }
        }

        function toggleRepost(postId) {
            const post = feedPosts.find(p => p.id === postId);
            if (post) {
                post.isReposted = !post.isReposted;
                post.stats.reposts += post.isReposted ? 1 : -1;
                renderFeed();
                showToast(post.isReposted ? 'Reposted' : 'Repost removed');
            }
        }

        function toggleBookmark(postId) {
            const post = feedPosts.find(p => p.id === postId);
            if (post) {
                post.isBookmarked = !post.isBookmarked;
                renderFeed();
                showToast(post.isBookmarked ? 'Saved to Bookmarks' : 'Removed from Bookmarks');
            }
        }

        function sharePost(postId) {
            showToast('Link copied to clipboard!');
        }

        function setActiveTab(tab) {
            currentFeedTab = tab;
            const indicator = document.getElementById('tab-indicator');
            const tabForYou = document.getElementById('tab-for-you');
            const tabFollowing = document.getElementById('tab-following');
            const tabMedia = document.getElementById('tab-media');

            [tabForYou, tabFollowing, tabMedia].forEach(t => t.className = t.className.replace('text-white', 'text-dark-muted'));

            if (tab === 'for-you') {
                tabForYou.classList.add('text-white');
                indicator.style.left = '16.6%';
            } else if (tab === 'following') {
                tabFollowing.classList.add('text-white');
                indicator.style.left = '50%';
            } else if (tab === 'media') {
                tabMedia.classList.add('text-white');
                indicator.style.left = '83.3%';
            }

            renderFeed();
        }

        function switchBottomNav(nav) {
            currentNavTab = nav;
            const navIds = ['home', 'explore', 'notifications', 'profile'];
            
            navIds.forEach(id => {
                const btn = document.getElementById('nav-' + id);
                if (id === nav) {
                    btn.className = 'flex flex-col items-center justify-center w-16 h-full text-brand-500 transition active:scale-95';
                } else {
                    btn.className = 'flex flex-col items-center justify-center w-16 h-full text-dark-muted transition active:scale-95';
                }
            });

            if (nav === 'explore') {
                toggleSearchOverlay();
            } else if (nav === 'notifications' || nav === 'profile') {
                showToast(`${nav.charAt(0).toUpperCase() + nav.slice(1)} view coming soon!`);
            } else {
                renderFeed();
            }
        }

        function toggleSearchOverlay() {
            const modal = document.getElementById('search-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('mobile-search-input').focus();
            } else {
                searchQuery = '';
                renderFeed();
            }
        }

        function handleSearch(val) {
            searchQuery = val.toLowerCase().trim();
            renderFeed();
        }

        function applyHashtagSearch(tag) {
            document.getElementById('mobile-search-input').value = '#' + tag;
            handleSearch('#' + tag);
            toggleSearchOverlay();
        }

        function showToast(msg) {
            const container = document.getElementById('toast-overlay');
            const toast = document.createElement('div');
            toast.className = 'bg-zinc-800 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-2xl flex items-center justify-center gap-2 border border-zinc-700 animate-fadeIn my-1';
            toast.innerHTML = `<i data-lucide="info" class="w-3.5 h-3.5 text-brand-500"></i> ${msg}`;
            container.appendChild(toast);
            refreshIcons();

            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition-opacity', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }

        function renderFeed() {
            const container = document.getElementById('feed-container');
            container.innerHTML = '';

            let filtered = feedPosts.filter(post => {
                if (searchQuery) {
                    return post.content.toLowerCase().includes(searchQuery) || post.author.name.toLowerCase().includes(searchQuery);
                }
                if (currentFeedTab === 'media') return post.media !== null;
                return true;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="p-10 text-center text-dark-muted space-y-2">
                        <i data-lucide="sparkles" class="w-10 h-10 mx-auto text-dark-muted/50"></i>
                        <p class="text-sm font-semibold">No posts in this view</p>
                        <p class="text-xs">Create a post or try switching tabs above.</p>
                    </div>
                `;
                refreshIcons();
                return;
            }

            filtered.forEach(post => {
                const card = document.createElement('article');
                card.className = 'p-3.5 hover:bg-dark-surface/40 transition border-b border-dark-border/60 flex gap-3 animate-fadeIn';

                let mediaElement = '';
                if (post.media) {
                    if (post.media.type === 'image') {
                        mediaElement = `
                            <div class="mt-2.5 rounded-xl overflow-hidden border border-dark-border bg-black max-h-80">
                                <img src="${post.media.url}" alt="Post attachment" class="w-full h-auto object-cover max-h-80">
                            </div>
                        `;
                    } else if (post.media.type === 'video') {
                        mediaElement = `
                            <div class="mt-2.5 rounded-xl overflow-hidden border border-dark-border bg-black">
                                <video controls preload="metadata" class="w-full max-h-80 object-contain">
                                    <source src="${post.media.url}" type="video/mp4">
                                    Your browser does not support playing HTML5 MP4 video.
                                </video>
                            </div>
                        `;
                    }
                }

                card.innerHTML = `
                    <img src="${post.author.avatar}" alt="${post.author.name}" class="w-9 h-9 rounded-full object-cover ring-1 ring-dark-border shrink-0">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center justify-between">
                            <div class="flex items-center gap-1 truncate">
                                <span class="font-bold text-xs text-white truncate">${post.author.name}</span>
                                ${post.author.verified ? `<i data-lucide="badge-check" class="w-3.5 h-3.5 text-brand-500 fill-brand-500 text-black shrink-0"></i>` : ''}
                                <span class="text-dark-muted text-[11px] truncate">@${post.author.handle}</span>
                                <span class="text-dark-muted text-[10px]">· ${post.timestamp}</span>
                            </div>
                            <button class="text-dark-muted p-1">
                                <i data-lucide="more-horizontal" class="w-4 h-4"></i>
                            </button>
                        </div>

                        ${post.content ? `<p class="mt-1 text-xs text-zinc-200 leading-relaxed">${formatText(post.content)}</p>` : ''}
                        ${mediaElement}

                        <!-- Action Bar -->
                        <div class="flex items-center justify-between mt-3 text-dark-muted text-[11px]">
                            <!-- Reply -->
                            <button class="flex items-center gap-1 hover:text-brand-500 active:scale-90 transition">
                                <i data-lucide="message-square" class="w-4 h-4"></i>
                                <span>${post.stats.replies || ''}</span>
                            </button>

                            <!-- Repost -->
                            <button onclick="toggleRepost('${post.id}')" class="flex items-center gap-1 ${post.isReposted ? 'text-emerald-500' : 'hover:text-emerald-500'} active:scale-90 transition">
                                <i data-lucide="repeat" class="w-4 h-4"></i>
                                <span>${post.stats.reposts || ''}</span>
                            </button>

                            <!-- Like -->
                            <button onclick="toggleLike('${post.id}')" class="flex items-center gap-1 ${post.isLiked ? 'text-rose-500' : 'hover:text-rose-500'} active:scale-90 transition">
                                <i data-lucide="heart" class="w-4 h-4 ${post.isLiked ? 'fill-rose-500 animate-heartPop' : ''}"></i>
                                <span>${post.stats.likes || ''}</span>
                            </button>

                            <!-- Share -->
                            <button onclick="sharePost('${post.id}')" class="hover:text-brand-500 active:scale-90 transition">
                                <i data-lucide="share-2" class="w-4 h-4"></i>
                            </button>

                            <!-- Bookmark -->
                            <button onclick="toggleBookmark('${post.id}')" class="${post.isBookmarked ? 'text-brand-500' : 'hover:text-brand-500'} active:scale-90 transition">
                                <i data-lucide="bookmark" class="w-4 h-4 ${post.isBookmarked ? 'fill-brand-500' : ''}"></i>
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            refreshIcons();
        }

        function formatText(str) {
            const escaped = str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            return escaped.replace(/#(\w+)/g, '<span class="text-brand-500 font-medium" onclick="applyHashtagSearch(\'$1\')">#$1</span>');
        }

        function refreshIcons() {
            lucide.createIcons();
        }

        // Initialize on load
        window.onload = function() {
            renderFeed();
            refreshIcons();

            // Track character count in mobile modal composer
            document.getElementById('modal-composer-text').addEventListener('input', function() {
                document.getElementById('char-counter').innerText = `${this.value.length} / 280`;
            });
        };
    </script>
