<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>StreamFlow - Custom Music Player</title>
  <style>
    /* RESET & CORE MOBILE STYLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-dark: #09090b;
      --card-bg: rgba(255, 255, 255, 0.05);
      --accent: #fe2c55;
      --text-main: #ffffff;
      --text-sub: #a1a1aa;
      --ambient-color: rgba(254, 44, 85, 0.25);
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", Roboto, Helvetica, Arial, sans-serif;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* AMBIENT BACKGROUND GLOW */
    .ambient-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 50% 20%, var(--ambient-color) 0%, transparent 70%);
      transition: background 0.8s ease;
      z-index: 0;
      pointer-events: none;
    }

    /* MAIN VIEWPORT */
    .app-viewport {
      position: relative;
      z-index: 1;
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 140px 16px;
      -webkit-overflow-scrolling: touch;
    }

    .app-viewport::-webkit-scrollbar { display: none; }

    /* HEADER & UPLOAD ACTION */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-top: 8px;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 10px;
      height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
    }

    .upload-btn {
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(254, 44, 85, 0.3);
      transition: transform 0.15s ease;
    }

    .upload-btn:active {
      transform: scale(0.95);
    }

    #fileInput { display: none; }

    /* SONG LIST */
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    .song-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 10px 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }

    .song-item:active {
      transform: scale(0.98);
      background: rgba(255, 255, 255, 0.1);
    }

    .song-item.active {
      border-color: var(--accent);
      background: rgba(254, 44, 85, 0.12);
    }

    .song-item img {
      width: 52px;
      height: 52px;
      border-radius: 10px;
      object-fit: cover;
    }

    .song-meta {
      flex: 1;
      overflow: hidden;
    }

    .song-title {
      font-size: 15px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-sub);
      font-size: 14px;
      line-height: 1.5;
    }

    /* MINI PLAYER BAR */
    .mini-player {
      position: fixed;
      bottom: 60px;
      left: 12px;
      right: 12px;
      height: 60px;
      background: rgba(20, 20, 25, 0.92);
      backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 10;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    .mini-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      overflow: hidden;
    }

    .mini-info img {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: cover;
    }

    .mini-text { overflow: hidden; }

    .mini-title {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-artist {
      font-size: 12px;
      color: var(--text-sub);
    }

    .play-btn-mini {
      width: 36px;
      height: 36px;
      background: #ffffff;
      color: #000;
      border-radius: 50%;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* FULL PLAYER SHEET */
    .full-player {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100dvh;
      background: #0d0d12;
      z-index: 100;
      display: flex;
      flex-direction: column;
      padding: 20px 24px 30px 24px;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .full-player.open { transform: translateY(0); }

    .drag-handle {
      width: 36px;
      height: 5px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      margin: 0 auto 20px auto;
      cursor: pointer;
    }

    .full-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 24px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .full-art-container {
      width: 100%;
      aspect-ratio: 1;
      max-height: 280px;
      margin: 0 auto 24px auto;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
    }

    .full-art-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .full-meta { margin-bottom: 20px; }

    .full-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .full-artist {
      font-size: 15px;
      color: var(--text-sub);
    }

    /* SEEK BAR */
    .progress-box { margin-bottom: 24px; }

    .seek-bar {
      width: 100%;
      height: 6px;
      appearance: none;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      outline: none;
    }

    .seek-bar::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 8px;
    }

    /* CONTROLS */
    .full-controls {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
    }

    .control-btn {
      background: none;
      border: none;
      color: #fff;
      cursor: pointer;
    }

    .play-btn-full {
      width: 64px;
      height: 64px;
      background: #ffffff;
      color: #000;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* BOTTOM NAVBAR */
    .mobile-navbar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 56px;
      background: rgba(10, 10, 12, 0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 5;
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .nav-btn.active { color: var(--accent); }
  </style>
</head>
<body>

  <div class="ambient-glow" id="ambientGlow"></div>

  <!-- MAIN VIEWPORT -->
  <main class="app-viewport">
    <header class="header">
      <div class="brand">
        <div class="brand-dot"></div>
        StreamFlow
      </div>

      <!-- Add Audio Button -->
      <label class="upload-btn" for="fileInput">
        + Add Audio
      </label>
      <input type="file" id="fileInput" accept="audio/*" multiple />
    </header>

    <h2 class="section-title">Your Playlist</h2>
    <div class="song-list" id="songList"></div>
  </main>

  <!-- MINI PLAYER -->
  <div class="mini-player" id="miniPlayer">
    <div class="mini-info" id="openFullPlayer">
      <img id="miniArt" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=200&auto=format&fit=crop&q=80" alt="Art">
      <div class="mini-text">
        <div class="mini-title" id="miniTitle">Select or Upload a Track</div>
        <div class="mini-artist" id="miniArtist">Tap + Add Audio above</div>
      </div>
    </div>
    <button class="play-btn-mini" id="miniPlayBtn">
      <svg id="miniPlayIcon" width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
  </div>

  <!-- FULL PLAYER SHEET -->
  <div class="full-player" id="fullPlayer">
    <div class="drag-handle" id="closeFullPlayer"></div>
    <div class="full-header">
      <span>NOW PLAYING</span>
      <button class="close-btn" id="closeBtn">✕</button>
    </div>

    <div class="full-art-container">
      <img id="fullArt" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&auto=format&fit=crop&q=80" alt="Art">
    </div>

    <div class="full-meta">
      <div class="full-title" id="fullTitle">Title</div>
      <div class="full-artist" id="fullArtist">Artist</div>
    </div>

    <div class="progress-box">
      <input type="range" class="seek-bar" id="seekBar" value="0" max="100">
      <div class="time-labels">
        <span id="currentTime">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="full-controls">
      <button class="control-btn" id="prevBtn">
        <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button class="control-btn play-btn-full" id="fullPlayBtn">
        <svg id="fullPlayIcon" width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="control-btn" id="nextBtn">
        <svg width="28" height="28" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- BOTTOM NAVBAR -->
  <nav class="mobile-navbar">
    <button class="nav-btn active">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      Home
    </button>
    <button class="nav-btn">
      <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      Library
    </button>
  </nav>

  <audio id="audio"></audio>

  <script>
    // 1. DEFAULT PLAYLIST DATA
    let playlist = [
      {
        id: 0,
        title: "Midnight Street Lights",
        artist: "Lo-Fi Collective",
        art: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=400&auto=format&fit=crop&q=80",
        src: "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3",
        glow: "rgba(233, 30, 99, 0.3)"
      },
      {
        id: 1,
        title: "Cyberpunk Resonance",
        artist: "SynthWave 84",
        art: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&auto=format&fit=crop&q=80",
        src: "https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=synthwave-80s-110045.mp3",
        glow: "rgba(0, 188, 212, 0.3)"
      }
    ];

    let currentTrackIndex = null;
    const audio = document.getElementById("audio");
    const songList = document.getElementById("songList");
    const fileInput = document.getElementById("fileInput");

    // 2. RENDER PLAYLIST
    function renderPlaylist() {
      if (playlist.length === 0) {
        songList.innerHTML = `
          <div class="empty-state">
            No audio files loaded yet.<br>Tap <b>"+ Add Audio"</b> at the top to select MP3s from your device!
          </div>`;
        return;
      }

      songList.innerHTML = playlist.map((s, i) => `
        <div class="song-item ${i === currentTrackIndex ? 'active' : ''}" onclick="playSong(${i})">
          <img src="${s.art}" alt="${s.title}">
          <div class="song-meta">
            <div class="song-title">${s.title}</div>
            <div class="song-artist">${s.artist}</div>
          </div>
        </div>
      `).join('');
    }

    // 3. PLAY TRACK FUNCTION
    function playSong(index) {
      currentTrackIndex = index;
      const track = playlist[index];
      audio.src = track.src;

      // Update Mini Player UI
      document.getElementById("miniArt").src = track.art;
      document.getElementById("miniTitle").innerText = track.title;
      document.getElementById("miniArtist").innerText = track.artist;

      // Update Full Player UI
      document.getElementById("fullArt").src = track.art;
      document.getElementById("fullTitle").innerText = track.title;
      document.getElementById("fullArtist").innerText = track.artist;
      document.getElementById("ambientGlow").style.background = 
        `radial-gradient(circle at 50% 20%, ${track.glow || 'rgba(254,44,85,0.25)'} 0%, transparent 70%)`;

      renderPlaylist();
      audio.play();
      togglePlayState(true);
    }

    function togglePlayState(isPlaying) {
      const playSvg = `<path d="M8 5v14l11-7z"/>`;
      const pauseSvg = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
      document.getElementById("miniPlayIcon").innerHTML = isPlaying ? pauseSvg : playSvg;
      document.getElementById("fullPlayIcon").innerHTML = isPlaying ? pauseSvg : playSvg;
    }

    function togglePlay() {
      if (currentTrackIndex === null && playlist.length > 0) {
        playSong(0);
        return;
      }
      if (audio.paused) {
        audio.play();
        togglePlayState(true);
      } else {
        audio.pause();
        togglePlayState(false);
      }
    }

    document.getElementById("miniPlayBtn").addEventListener("click", (e) => {
      e.stopPropagation();
      togglePlay();
    });

    document.getElementById("fullPlayBtn").addEventListener("click", togglePlay);

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (playlist.length === 0) return;
      let prev = (currentTrackIndex - 1 + playlist.length) % playlist.length;
      playSong(prev);
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (playlist.length === 0) return;
      let next = (currentTrackIndex + 1) % playlist.length;
      playSong(next);
    });

    // 4. ADD MP3 / AUDIO FILES SYSTEM
    fileInput.addEventListener("change", (e) => {
      const files = Array.from(e.target.files);
      if (!files || files.length === 0) return;

      files.forEach((file) => {
        // Create a local blob URL for instant playback
        const objectURL = URL.createObjectURL(file);
        
        // Clean up file name to use as title
        const cleanName = file.name.replace(/\.[^/.]+$/, "");

        const newTrack = {
          id: playlist.length,
          title: cleanName,
          artist: "Local Upload",
          art: "https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=400&auto=format&fit=crop&q=80",
          src: objectURL,
          glow: "rgba(254, 44, 85, 0.3)"
        };

        playlist.unshift(newTrack); // Add to beginning of playlist
      });

      renderPlaylist();
      playSong(0); // Auto-play the newly added track
      fileInput.value = ""; // Reset input
    });

    // 5. FULL PLAYER SHEET CONTROLS
    const fullPlayer = document.getElementById("fullPlayer");
    document.getElementById("openFullPlayer").addEventListener("click", () => {
      fullPlayer.classList.add("open");
    });

    const closeSheet = () => fullPlayer.classList.remove("open");
    document.getElementById("closeBtn").addEventListener("click", closeSheet);
    document.getElementById("closeFullPlayer").addEventListener("click", closeSheet);

    // 6. SEEK BAR & DURATION CONTROLS
    const seekBar = document.getElementById("seekBar");
    audio.addEventListener("timeupdate", () => {
      if (!isNaN(audio.duration)) {
        seekBar.value = (audio.currentTime / audio.duration) * 100;
        document.getElementById("currentTime").innerText = formatTime(audio.currentTime);
        document.getElementById("duration").innerText = formatTime(audio.duration);
      }
    });

    seekBar.addEventListener("input", (e) => {
      if (audio.duration) {
        audio.currentTime = (e.target.value / 100) * audio.duration;
      }
    });

    audio.addEventListener("ended", () => {
      let next = (currentTrackIndex + 1) % playlist.length;
      playSong(next);
    });

    function formatTime(s) {
      let m = Math.floor(s / 60);
      let sec = Math.floor(s % 60);
      return `${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    renderPlaylist();
  </script>
</body>
</html>
