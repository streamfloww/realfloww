<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>shoot Philly bop</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        /* Crosshair */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 20px;
            height: 20px;
            pointer-events: none;
            z-index: 10;
            transition: opacity 0.1s ease;
        }
        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 0 2px rgba(0,0,0,0.8);
        }
        #crosshair::before {
            top: 9px; left: 0; width: 20px; height: 2px;
        }
        #crosshair::after {
            top: 0; left: 9px; width: 2px; height: 20px;
        }
        #crosshair-dot {
            position: absolute;
            top: 9px; left: 9px; width: 2px; height: 2px;
            background: #ff3333;
            border-radius: 50%;
        }

        /* Hitmarker */
        #hitmarker {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%) rotate(45deg);
            width: 28px; height: 28px;
            pointer-events: none;
            z-index: 11;
            opacity: 0;
            transition: opacity 0.05s ease-out;
        }
        .hm-line {
            position: absolute;
            background: #ff1a1a;
            box-shadow: 0 0 4px #ff0000;
        }
        .hm-1 { top: 0; left: 12px; width: 4px; height: 10px; }
        .hm-2 { bottom: 0; left: 12px; width: 4px; height: 10px; }
        .hm-3 { top: 12px; left: 0; width: 10px; height: 4px; }
        .hm-4 { top: 12px; right: 0; width: 10px; height: 4px; }

        /* Blood Overlay */
        #damage-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9;
            box-shadow: inset 0 0 100px rgba(255, 0, 0, 0);
            transition: box-shadow 0.1s ease;
        }

        /* HUD Top Left - Score & Kills */
        #stats-hud {
            position: absolute;
            top: 20px; left: 20px;
            z-index: 10;
            color: #fff;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }
        .stat-val { font-size: 24px; color: #ffb703; }

        /* HUD Bottom Left - Radar & Health */
        #radar-container {
            position: absolute;
            bottom: 25px; left: 25px;
            width: 140px; height: 140px;
            border-radius: 50%;
            background: rgba(10, 20, 15, 0.75);
            border: 2px solid rgba(0, 255, 100, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 100, 0.2);
            z-index: 10;
            overflow: hidden;
        }
        #radar-canvas {
            width: 100%; height: 100%;
        }
        #health-bar-bg {
            position: absolute;
            bottom: 25px; left: 180px;
            width: 200px; height: 14px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255,255,255,0.2);
            z-index: 10;
            border-radius: 3px;
            overflow: hidden;
        }
        #health-bar-fill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #ff3333, #00ff66);
            transition: width 0.2s ease;
        }
        #health-text {
            position: absolute;
            bottom: 43px; left: 180px;
            color: #fff; font-size: 13px; font-weight: bold;
            z-index: 10; text-shadow: 1px 1px 2px #000;
        }

        /* HUD Bottom Right - Ammo & Weapon */
        #weapon-hud {
            position: absolute;
            bottom: 25px; right: 25px;
            text-align: right;
            color: #fff; z-index: 10;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
        }
        #weapon-name {
            font-size: 22px; font-weight: 900;
            letter-spacing: 2px; color: #00d4ff;
            margin-bottom: 2px;
        }
        #ammo-display {
            font-size: 38px; font-weight: 800; line-height: 1;
        }
        #ammo-reserve {
            font-size: 20px; color: #aaa;
        }

        /* Killfeed */
        #killfeed {
            position: absolute;
            top: 20px; right: 20px;
            width: 280px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            pointer-events: none;
        }
        .kill-entry {
            background: rgba(0,0,0,0.65);
            border-right: 4px solid #ff3333;
            padding: 4px 10px;
            font-size: 12px; color: #fff;
            font-weight: bold;
            border-radius: 2px 0 0 2px;
            animation: fadeOut 4s forwards;
        }
        @keyframes fadeOut {
            0% { opacity: 1; transform: translateX(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(20px); }
        }

        /* Start Screen Overlay */
        #start-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 8, 15, 0.88);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            backdrop-filter: blur(8px);
        }
        #start-title {
            font-size: 52px; font-weight: 900;
            letter-spacing: 4px; color: #ff9900;
            text-shadow: 0 0 20px rgba(255, 153, 0, 0.6);
            margin-bottom: 8px;
            text-align: center;
            text-transform: uppercase;
        }
        #start-subtitle {
            font-size: 16px; color: #ccc; margin-bottom: 35px;
            text-transform: uppercase; letter-spacing: 2px;
        }
        #start-btn {
            padding: 18px 50px;
            font-size: 22px; font-weight: 900;
            background: linear-gradient(135deg, #ff9900, #ff5500);
            border: none; color: #fff;
            border-radius: 4px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px;
            box-shadow: 0 0 25px rgba(255,100,0,0.5);
            transition: transform 0.1s ease;
        }
        #start-btn:hover { transform: scale(1.05); }
        .controls-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 10px 30px; margin-top: 35px; font-size: 13px; color: #aaa;
        }
        .controls-grid span { color: #fff; font-weight: bold; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>
    <div id="damage-overlay"></div>

    <div id="crosshair"><div id="crosshair-dot"></div></div>
    
    <div id="hitmarker">
        <div class="hm-line hm-1"></div>
        <div class="hm-line hm-2"></div>
        <div class="hm-line hm-3"></div>
        <div class="hm-line hm-4"></div>
    </div>

    <!-- Stats HUD -->
    <div id="stats-hud">
        <div>SCORE: <span id="score-val" class="stat-val">0</span></div>
        <div style="font-size: 13px; color: #aaa; margin-top: 2px;">KILLS: <span id="kills-val" style="color:#fff;">0</span></div>
    </div>

    <!-- Radar & Health -->
    <div id="radar-container"><canvas id="radar-canvas" width="140" height="140"></canvas></div>
    <div id="health-text">OPERATOR HEALTH</div>
    <div id="health-bar-bg"><div id="health-bar-fill"></div></div>

    <!-- Weapon Info -->
    <div id="weapon-hud">
        <div id="weapon-name">AN-94</div>
        <div><span id="ammo-display">30</span> / <span id="ammo-reserve">120</span></div>
    </div>

    <!-- Killfeed -->
    <div id="killfeed"></div>

    <!-- Start Overlay / Menu -->
    <div id="start-overlay">
        <div id="start-title">shoot Philly bop</div>
        <div id="start-subtitle">3D Tactical Combat Engine</div>

        <button id="start-btn">DEPLOY TO COMBAT</button>

        <div class="controls-grid">
            <div><span>WASD</span> - Move Operator</div>
            <div><span>MOUSE</span> - Look / Aim</div>
            <div><span>LEFT CLICK</span> - Fire Weapon</div>
            <div><span>RIGHT CLICK</span> - Aim Down Sights (ADS)</div>
            <div><span>1 - 4</span> - Switch Weapons</div>
            <div><span>R</span> - Tactical Reload</div>
            <div><span>G</span> - Throw Frag Grenade</div>
            <div><span>SPACE / C</span> - Jump / Crouch</div>
        </div>
    </div>

    <!-- Load Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>

    <script>
        // --- GAME ENGINE SETUP ---
        let scene, camera, renderer, world;
        let clock = new THREE.Clock();
        
        // --- EMBEDDED BOT FACE IMAGE (PERMANENT) ---
        // Replace the string inside the quotes below with your Base64 image string!
        const EMBEDDED_FACE_BASE64 = "PASTE_YOUR_BASE64_IMAGE_STRING_HERE";

        let customBotTexture = null;

        // Load the embedded image texture automatically on startup
        if (EMBEDDED_FACE_BASE64 && EMBEDDED_FACE_BASE64 !== "PASTE_YOUR_BASE64_IMAGE_STRING_HERE") {
            const img = new Image();
            img.onload = function() {
                customBotTexture = new THREE.Texture(img);
                customBotTexture.needsUpdate = true;
            };
            img.src = EMBEDDED_FACE_BASE64;
        }

        // Player State
        const player = {
            height: 1.8,
            speed: 12,
            crouchHeight: 1.0,
            isCrouching: false,
            health: 100,
            score: 0,
            kills: 0,
            position: new THREE.Vector3(0, 1.8, 25),
            velocity: new THREE.Vector3(),
            body: null,
            canJump: true
        };

        // Controls
        let keys = {};
        let mouseX = 0, mouseY = 0;
        let pitch = 0, yaw = 0;
        let isLocked = false;
        let isADS = false;

        // Weapons Config
        const weapons = [
            { name: 'AN-94', ammo: 30, maxAmmo: 30, reserve: 120, damage: 34, firerate: 0.1, recoil: 0.03, spread: 0.015, color: 0x333333, zoomFov: 45 },
            { name: 'DSR-50', ammo: 5, maxAmmo: 5, reserve: 25, damage: 100, firerate: 1.1, recoil: 0.12, spread: 0.002, color: 0x1a1a1a, zoomFov: 20 },
            { name: 'MSMC', ammo: 30, maxAmmo: 30, reserve: 150, damage: 25, firerate: 0.07, recoil: 0.025, spread: 0.03, color: 0x444433, zoomFov: 50 },
            { name: 'REMINGTON 870', ammo: 8, maxAmmo: 8, reserve: 32, damage: 18, pellets: 8, firerate: 0.8, recoil: 0.09, spread: 0.08, color: 0x222222, zoomFov: 55 }
        ];
        let currentWeaponIndex = 0;
        let lastFireTime = 0;
        let isReloading = false;

        // Visuals & Scene Elements
        let gunMesh, sightMesh, muzzleLight;
        let enemies = [];
        let grenades = [];
        let barrels = [];
        let particles = [];

        // --- AUDIO SYNTHESIZER ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playGunSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'DSR-50') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } else {
                osc.type = 'square';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
                osc.start(); osc.stop(audioCtx.currentTime + 0.12);
            }
        }

        function playHitSound() {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.start(); osc.stop(audioCtx.currentTime + 0.05);
        }

        // --- INIT FUNCTION ---
        function init() {
            // Three.js Scene
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0e141d);
            scene.fog = new THREE.FogExp2(0x0e141d, 0.012);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Physics World (Cannon.js)
            world = new CANNON.World();
            world.gravity.set(0, -18, 0);

            // Player Physics Body
            const mass = 75;
            const radius = 0.8;
            const sphereShape = new CANNON.Sphere(radius);
            player.body = new CANNON.Body({ mass: mass });
            player.body.addShape(sphereShape);
            player.body.position.set(0, 2, 25);
            player.body.linearDamping = 0.9;
            world.addBody(player.body);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffddaa, 1.2);
            sunLight.position.set(40, 60, 20);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            // Create Environment & Map
            buildMap();

            // Create Player Weapon Model
            buildWeapon();

            // Spawn Initial Bot Wave
            for (let i = 0; i < 5; i++) {
                spawnBot();
            }

            // Listeners
            setupEventListeners();

            // Animation Loop
            animate();
        }

        // --- MAP BUILDER ---
        function buildMap() {
            // Ground
            const groundGeo = new THREE.PlaneGeometry(120, 120);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.8 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const groundBody = new CANNON.Body({ mass: 0, shape: new CANNON.Plane() });
            groundBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(groundBody);

            // Perimeter Walls
            createWall(0, 5, -60, 120, 10, 2);
            createWall(0, 5, 60, 120, 10, 2);
            createWall(-60, 5, 0, 2, 10, 120);
            createWall(60, 5, 0, 2, 10, 120);

            // Buildings / Containers Cover
            createBox(15, 3, 0, 8, 6, 16, 0xbf360c); // Red Shipping Container
            createBox(-15, 3, -10, 10, 6, 8, 0x0288d1); // Blue Container
            createBox(0, 2, -20, 12, 4, 4, 0x424242); // Central Concrete Bunker

            // Stacked Explosive Barrels
            spawnBarrel(5, 1.2, 5);
            spawnBarrel(6.5, 1.2, 5);
            spawnBarrel(5.8, 3.2, 5);
            spawnBarrel(-8, 1.2, -5);
        }

        function createWall(x, y, z, w, h, d) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: 0x37474f, roughness: 0.7 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            mesh.castShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0, shape: shape });
            body.position.set(x, y, z);
            world.addBody(body);
        }

        function createBox(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(w/2, h/2, d/2));
            const body = new CANNON.Body({ mass: 0, shape: shape });
            body.position.set(x, y, z);
            world.addBody(body);
        }

        function spawnBarrel(x, y, z) {
            const geo = new THREE.CylinderGeometry(0.7, 0.7, 2, 16);
            const mat = new THREE.MeshStandardMaterial({ color: 0xd32f2f, metalness: 0.3, roughness: 0.4 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Cylinder(0.7, 0.7, 2, 16);
            const body = new CANNON.Body({ mass: 25, shape: shape });
            body.position.set(x, y, z);
            world.addBody(body);

            barrels.push({ mesh: mesh, body: body, hp: 40 });
        }

        // --- WEAPON MESH PROCEDURAL CREATION ---
        function buildWeapon() {
            gunMesh = new THREE.Group();

            // Main Body
            const bodyGeo = new THREE.BoxGeometry(0.12, 0.18, 0.7);
            const bodyMat = new THREE.MeshStandardMaterial({ color: weapons[currentWeaponIndex].color, metalness: 0.8, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            gunMesh.add(body);

            // Barrel
            const barrelGeo = new THREE.CylinderGeometry(0.025, 0.025, 0.6, 12);
            const barrelMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.03, -0.5);
            gunMesh.add(barrel);

            // Holographic Optic Sight
            const sightFrameGeo = new THREE.BoxGeometry(0.08, 0.08, 0.12);
            const sightFrameMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            sightMesh = new THREE.Mesh(sightFrameGeo, sightFrameMat);
            sightMesh.position.set(0, 0.12, -0.1);

            // Red Reticle Light Glass
            const glassGeo = new THREE.PlaneGeometry(0.05, 0.05);
            const glassMat = new THREE.MeshBasicMaterial({ color: 0xff0000, side: THREE.DoubleSide });
            const reticle = new THREE.Mesh(glassGeo, glassMat);
            reticle.position.set(0, 0, -0.05);
            sightMesh.add(reticle);

            gunMesh.add(sightMesh);

            // Muzzle Flash Dynamic Light
            muzzleLight = new THREE.PointLight(0xffaa00, 0, 8);
            muzzleLight.position.set(0, 0.03, -0.8);
            gunMesh.add(muzzleLight);

            // Attach to Camera
            gunMesh.position.set(0.28, -0.25, -0.5);
            camera.add(gunMesh);
            scene.add(camera);
        }

        // --- HUMANOID BOT CREATION ---
        function spawnBot() {
            const botGroup = new THREE.Group();

            // Torso / Vest
            const torsoGeo = new THREE.BoxGeometry(0.7, 0.9, 0.4);
            const torsoMat = new THREE.MeshStandardMaterial({ color: 0x2e7d32, roughness: 0.6 });
            const torso = new THREE.Mesh(torsoGeo, torsoMat);
            torso.position.y = 1.35;
            torso.castShadow = true;
            botGroup.add(torso);

            // Head with Custom Embedded Face Texture
            const headGeo = new THREE.BoxGeometry(0.45, 0.45, 0.45);
            let headMat;
            if (customBotTexture) {
                headMat = new THREE.MeshStandardMaterial({ map: customBotTexture });
            } else {
                headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            }
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 2.1;
            head.castShadow = true;
            botGroup.add(head);

            // Helmet
            const helmetGeo = new THREE.BoxGeometry(0.5, 0.2, 0.5);
            const helmetMat = new THREE.MeshStandardMaterial({ color: 0x1b5e20 });
            const helmet = new THREE.Mesh(helmetGeo, helmetMat);
            helmet.position.y = 2.35;
            botGroup.add(helmet);

            // Limbs
            const legGeo = new THREE.BoxGeometry(0.25, 0.9, 0.25);
            const legMat = new THREE.MeshStandardMaterial({ color: 0x1b3022 });
            
            const legL = new THREE.Mesh(legGeo, legMat);
            legL.position.set(-0.2, 0.45, 0);
            botGroup.add(legL);

            const legR = new THREE.Mesh(legGeo, legMat);
            legR.position.set(0.2, 0.45, 0);
            botGroup.add(legR);

            // Random Spawn Point
            const rx = (Math.random() - 0.5) * 80;
            const rz = (Math.random() - 0.5) * 80 - 10;
            botGroup.position.set(rx, 0, rz);
            scene.add(botGroup);

            // Physics Cylinder Body
            const shape = new CANNON.Cylinder(0.5, 0.5, 2.2, 8);
            const body = new CANNON.Body({ mass: 60, shape: shape });
            body.position.set(rx, 1.1, rz);
            body.fixedRotation = true;
            world.addBody(body);

            enemies.push({
                group: botGroup,
                headMesh: head,
                body: body,
                hp: 100,
                lastShot: 0
            });
        }

        // --- USER INPUT & CONTROLS ---
        function setupEventListeners() {
            document.getElementById('start-btn').addEventListener('click', () => {
                document.body.requestPointerLock();
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = (document.pointerLockElement === document.body);
                document.getElementById('start-overlay').style.display = isLocked ? 'none' : 'flex';
            });

            document.addEventListener('mousemove', (e) => {
                if (!isLocked) return;
                const sensitivity = 0.0022;
                yaw -= e.movementX * sensitivity;
                pitch -= e.movementY * sensitivity;
                pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));
            });

            document.addEventListener('keydown', (e) => {
                keys[e.code] = true;
                if (e.code === 'KeyR') reloadWeapon();
                if (e.code === 'KeyG') throwGrenade();
                if (e.code === 'Digit1') switchWeapon(0);
                if (e.code === 'Digit2') switchWeapon(1);
                if (e.code === 'Digit3') switchWeapon(2);
                if (e.code === 'Digit4') switchWeapon(3);
            });

            document.addEventListener('keyup', (e) => { keys[e.code] = false; });

            document.addEventListener('mousedown', (e) => {
                if (!isLocked) return;
                if (e.button === 0) shootWeapon();
                if (e.button === 2) isADS = true;
            });

            document.addEventListener('mouseup', (e) => {
                if (e.button === 2) isADS = false;
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        // --- SHOOTING & COMBAT MECHANICS ---
        function shootWeapon() {
            const wP = weapons[currentWeaponIndex];
            const now = clock.getElapsedTime();

            if (now - lastFireTime < wP.firerate || isReloading) return;
            if (wP.ammo <= 0) { reloadWeapon(); return; }

            wP.ammo--;
            lastFireTime = now;
            updateHUD();

            // Muzzle FX & Sound
            playGunSound(wP.name);
            muzzleLight.intensity = 3;
            setTimeout(() => muzzleLight.intensity = 0, 40);

            // Camera Kickback
            pitch += wP.recoil;

            // Bullet Raycasting
            const raycaster = new THREE.Raycaster();
            const center = new THREE.Vector2(0, 0);
            
            const pellets = wP.pellets || 1;
            for (let p = 0; p < pellets; p++) {
                const spreadX = (Math.random() - 0.5) * (isADS ? wP.spread * 0.2 : wP.spread);
                const spreadY = (Math.random() - 0.5) * (isADS ? wP.spread * 0.2 : wP.spread);
                
                raycaster.setFromCamera(new THREE.Vector2(center.x + spreadX, center.y + spreadY), camera);

                // Check Bot Hits
                enemies.forEach((bot, index) => {
                    const intersects = raycaster.intersectObjects(bot.group.children);
                    if (intersects.length > 0) {
                        bot.hp -= wP.damage;
                        triggerHitmarker();

                        // Impulse force on bot
                        bot.body.velocity.x += raycaster.ray.direction.x * 4;
                        bot.body.velocity.z += raycaster.ray.direction.z * 4;

                        if (bot.hp <= 0) {
                            killBot(bot, index);
                        }
                    }
                });

                // Check Barrel Explosions
                barrels.forEach((barrel, index) => {
                    const intersects = raycaster.intersectObject(barrel.mesh);
                    if (intersects.length > 0) {
                        barrel.hp -= wP.damage;
                        if (barrel.hp <= 0) explodeBarrel(barrel, index);
                    }
                });
            }
        }

        function triggerHitmarker() {
            playHitSound();
            const hm = document.getElementById('hitmarker');
            hm.style.opacity = '1';
            setTimeout(() => hm.style.opacity = '0', 80);
        }

        function killBot(bot, index) {
            scene.remove(bot.group);
            world.remove(bot.body);
            enemies.splice(index, 1);

            player.score += 100;
            player.kills += 1;
            updateHUD();

            addKillfeedEntry(`Player [${weapons[currentWeaponIndex].name}] Enemy Bot`);

            // Respawn new bot after 2 seconds
            setTimeout(spawnBot, 2000);
        }

        function addKillfeedEntry(text) {
            const feed = document.getElementById('killfeed');
            const entry = document.createElement('div');
            entry.className = 'kill-entry';
            entry.innerText = text;
            feed.appendChild(entry);
            setTimeout(() => entry.remove(), 4000);
        }

        function reloadWeapon() {
            const wP = weapons[currentWeaponIndex];
            if (isReloading || wP.ammo === wP.maxAmmo || wP.reserve <= 0) return;

            isReloading = true;
            document.getElementById('weapon-name').innerText = 'RELOADING...';

            setTimeout(() => {
                const needed = wP.maxAmmo - wP.ammo;
                const added = Math.min(needed, wP.reserve);
                wP.ammo += added;
                wP.reserve -= added;
                isReloading = false;
                updateHUD();
            }, 1200);
        }

        function switchWeapon(index) {
            if (index < 0 || index >= weapons.length) return;
            currentWeaponIndex = index;
            buildWeapon();
            updateHUD();
        }

        function throwGrenade() {
            const geo = new THREE.SphereGeometry(0.2, 12, 12);
            const mat = new THREE.MeshStandardMaterial({ color: 0x336633 });
            const mesh = new THREE.Mesh(geo, mat);
            scene.add(mesh);

            const body = new CANNON.Body({ mass: 2, shape: new CANNON.Sphere(0.2) });
            const dir = new THREE.Vector3();
            camera.getWorldDirection(dir);

            body.position.set(camera.position.x + dir.x, camera.position.y, camera.position.z + dir.z);
            body.velocity.set(dir.x * 22, dir.y * 22 + 4, dir.z * 22);
            world.addBody(body);

            setTimeout(() => {
                // Explode Grenade
                scene.remove(mesh);
                world.remove(body);
                createExplosionFX(body.position);
            }, 2500);
        }

        function explodeBarrel(barrel, index) {
            scene.remove(barrel.mesh);
            world.remove(barrel.body);
            barrels.splice(index, 1);
            createExplosionFX(barrel.body.position);
        }

        function createExplosionFX(pos) {
            // Damage radial entities
            enemies.forEach((bot, bIdx) => {
                const dist = bot.group.position.distanceTo(pos);
                if (dist < 10) {
                    bot.hp -= (10 - dist) * 15;
                    bot.body.velocity.y += 8;
                    if (bot.hp <= 0) killBot(bot, bIdx);
                }
            });

            // Player Damage if close
            const pDist = player.body.position.distanceTo(pos);
            if (pDist < 8) {
                player.health -= Math.floor((8 - pDist) * 12);
                triggerDamageOverlay();
            }

            // Explosion Visual Light
            const expLight = new THREE.PointLight(0xff6600, 10, 20);
            expLight.position.copy(pos);
            scene.add(expLight);
            setTimeout(() => scene.remove(expLight), 300);
        }

        function triggerDamageOverlay() {
            const overlay = document.getElementById('damage-overlay');
            overlay.style.boxShadow = 'inset 0 0 100px rgba(255, 0, 0, 0.8)';
            setTimeout(() => {
                overlay.style.boxShadow = 'inset 0 0 100px rgba(255, 0, 0, 0)';
            }, 300);
            updateHUD();
        }

        function updateHUD() {
            const wP = weapons[currentWeaponIndex];
            document.getElementById('weapon-name').innerText = wP.name;
            document.getElementById('ammo-display').innerText = wP.ammo;
            document.getElementById('ammo-reserve').innerText = wP.reserve;
            document.getElementById('score-val').innerText = player.score;
            document.getElementById('kills-val').innerText = player.kills;
            document.getElementById('health-bar-fill').style.width = Math.max(0, player.health) + '%';
        }

        // --- RADAR MINIMAP RENDERER ---
        function updateRadar() {
            const canvas = document.getElementById('radar-canvas');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 140, 140);

            // Center Player Marker
            ctx.fillStyle = '#00d4ff';
            ctx.beginPath(); ctx.arc(70, 70, 4, 0, Math.PI * 2); ctx.fill();

            // Enemy Red Blips
            ctx.fillStyle = '#ff3333';
            enemies.forEach(bot => {
                const dx = (bot.group.position.x - player.body.position.x) * 1.5;
                const dz = (bot.group.position.z - player.body.position.z) * 1.5;
                if (Math.hypot(dx, dz) < 65) {
                    ctx.beginPath();
                    ctx.arc(70 + dx, 70 + dz, 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });
        }

        // --- MAIN GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const dt = clock.getDelta();
            world.step(1 / 60, dt, 3);

            if (isLocked) {
                // Movement Handling
                const speed = keys['ShiftLeft'] ? player.speed * 1.5 : player.speed;
                const forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
                const side = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);

                const moveDir = new THREE.Vector3(side, 0, -forward).normalize();
                moveDir.applyAxisAngle(new THREE.Vector3(0, 1, 0), yaw);

                player.body.velocity.x = moveDir.x * speed;
                player.body.velocity.z = moveDir.z * speed;

                if (keys['Space'] && player.canJump) {
                    player.body.velocity.y = 8;
                    player.canJump = false;
                }
                if (Math.abs(player.body.velocity.y) < 0.05) player.canJump = true;

                // Sync Camera to Physics Body
                camera.position.copy(player.body.position);
                camera.position.y += player.height - 0.8;

                // Apply Camera Rotation
                camera.rotation.order = 'YXZ';
                camera.rotation.y = yaw;
                camera.rotation.x = pitch;

                // ADS Smooth Transition
                const targetFov = isADS ? weapons[currentWeaponIndex].zoomFov : 75;
                camera.fov += (targetFov - camera.fov) * 0.2;
                camera.updateProjectionMatrix();

                const targetGunPos = isADS ? new THREE.Vector3(0, -0.14, -0.3) : new THREE.Vector3(0.28, -0.25, -0.5);
                gunMesh.position.lerp(targetGunPos, 0.2);

                // Update Bot Behaviors & Synchronization
                enemies.forEach(bot => {
                    bot.group.position.copy(bot.body.position);
                    bot.group.position.y -= 1.1;

                    // AI Pathing towards player
                    const dirToPlayer = new THREE.Vector3().subVectors(player.body.position, bot.body.position);
                    dirToPlayer.y = 0;
                    if (dirToPlayer.length() > 5) {
                        dirToPlayer.normalize();
                        bot.body.velocity.x = dirToPlayer.x * 4;
                        bot.body.velocity.z = dirToPlayer.z * 4;
                        bot.group.rotation.y = Math.atan2(dirToPlayer.x, dirToPlayer.z);
                    }

                    // Bot Shooting Back
                    if (clock.getElapsedTime() - bot.lastShot > 2.5) {
                        if (bot.group.position.distanceTo(player.body.position) < 30) {
                            bot.lastShot = clock.getElapsedTime();
                            player.health -= 8;
                            triggerDamageOverlay();
                        }
                    }
                });

                // Update Barrels
                barrels.forEach(barrel => {
                    barrel.mesh.position.copy(barrel.body.position);
                    barrel.mesh.quaternion.copy(barrel.body.quaternion);
                });

                updateRadar();
            }

            renderer.render(scene, camera);
        }

        // Start Everything
        init();
    </script>
</body>
</html>
