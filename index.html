<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Instagram • OmniMedia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root {
      --bg: #000000;
      --card-bg: #0e0f14;
      --surface-glass: rgba(18, 20, 29, 0.75);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(255, 255, 255, 0.15);
      --accent-gradient: linear-gradient(135deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
      --accent-pink: #e1306c;
      --accent-blue: #0095f6;
      --text-main: #ffffff;
      --text-muted: #8e8e93;
      --text-subtle: #636366;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-full: 9999px;
      --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --header-height: 60px;
      --nav-height: 65px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      font-family: var(--font-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(225, 48, 108, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(0, 149, 246, 0.05) 0%, transparent 40%);
    }

    .app-viewport {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-top: var(--header-height);
      padding-bottom: calc(var(--nav-height) + 10px);
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
      border-left: 1px solid var(--border-glass);
      border-right: 1px solid var(--border-glass);
    }

    @media (min-width: 1024px) {
      .app-viewport {
        max-width: 620px;
      }
    }

    /* TOP HEADER */
    .top-bar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: var(--header-height);
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    @media (min-width: 1024px) {
      .top-bar { max-width: 620px; }
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .icon-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: var(--radius-full);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      position: relative;
      transition: all 0.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .icon-btn:active {
      transform: scale(0.92);
      background: rgba(255,255,255,0.12);
    }

    .badge-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 8px;
      height: 8px;
      background: var(--accent-pink);
      border-radius: 50%;
      border: 2px solid #000;
    }

    /* STORIES TRAY */
    .stories-container {
      width: 100%;
      padding: 14px 0 10px 0;
      border-bottom: 1px solid var(--border-glass);
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .stories-container::-webkit-scrollbar { display: none; }

    .stories-wrapper {
      display: flex;
      gap: 16px;
      padding: 0 16px;
      width: max-content;
    }

    .story-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      width: 68px;
    }

    .story-ring {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      padding: 2.5px;
      background: var(--accent-gradient);
      position: relative;
      transition: transform 0.2s ease;
    }

    .story-item:active .story-ring {
      transform: scale(0.94);
    }

    .story-ring.seen {
      background: var(--border-accent);
    }

    .story-ring.my-story {
      background: rgba(255,255,255,0.1);
    }

    .story-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--bg);
      background: #111;
    }

    .add-story-plus {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 20px;
      height: 20px;
      background: var(--accent-blue);
      border: 2px solid var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #fff;
    }

    .story-username {
      font-size: 0.7rem;
      color: var(--text-muted);
      width: 100%;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    /* FEED POSTS */
    .feed-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding-top: 8px;
    }

    .post-card {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      flex-direction: column;
    }

    /* Post Header */
    .post-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }

    .post-author-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .author-avatar-ring {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      padding: 1.5px;
      background: var(--accent-gradient);
    }

    .author-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid var(--bg);
    }

    .author-details {
      display: flex;
      flex-direction: column;
    }

    .author-name-row {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .author-username {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .verified-badge {
      color: var(--accent-blue);
      font-size: 0.75rem;
    }

    .post-sub-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
    }

    .pill-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255,255,255,0.06);
      padding: 2px 8px;
      border-radius: var(--radius-full);
      font-size: 0.68rem;
      color: var(--text-main);
      border: 1px solid var(--border-glass);
    }

    .soundwave-icon {
      display: flex;
      align-items: flex-end;
      gap: 1.5px;
      height: 10px;
    }
    .soundwave-icon span {
      width: 2px;
      background: var(--accent-pink);
      border-radius: 1px;
      animation: soundwave 1s ease-in-out infinite alternate;
    }
    .soundwave-icon span:nth-child(1) { height: 40%; animation-delay: 0.1s; }
    .soundwave-icon span:nth-child(2) { height: 100%; animation-delay: 0.3s; }
    .soundwave-icon span:nth-child(3) { height: 60%; animation-delay: 0.2s; }

    @keyframes soundwave {
      0% { height: 30%; }
      100% { height: 100%; }
    }

    /* MEDIA CAROUSEL WITH TOUCH/SWIPE SNAP */
    .media-viewport {
      position: relative;
      width: 100%;
      aspect-ratio: 4/5;
      background: #000;
      overflow: hidden;
      touch-action: pan-y;
    }

    .media-slider {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -ms-overflow-style: none;
      scroll-behavior: smooth;
    }
    .media-slider::-webkit-scrollbar { display: none; }

    .media-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050508;
    }

    .media-slide img, 
    .media-slide video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* DOUBLE TAP HEART ANIMATION */
    .heart-burst {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      font-size: 5.5rem;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(225, 48, 108, 0.8);
      pointer-events: none;
      z-index: 10;
      opacity: 0;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
    }

    .heart-burst.animate {
      transform: translate(-50%, -50%) scale(1.1);
      opacity: 1;
      animation: burstFade 0.8s forwards;
    }

    @keyframes burstFade {
      0% { transform: translate(-50%, -50%) scale(0.2); opacity: 0; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      80% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0; }
    }

    /* Carousel Badges */
    .carousel-count-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: var(--radius-full);
      border: 1px solid var(--border-glass);
      z-index: 5;
    }

    /* POST ACTIONS BAR */
    .post-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 8px 16px;
    }

    .left-actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .action-icon-btn {
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.4rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .action-icon-btn:active {
      transform: scale(0.85);
    }

    .action-icon-btn.liked {
      color: var(--accent-pink);
      animation: heartPop 0.3s ease;
    }

    @keyframes heartPop {
      0% { transform: scale(1); }
      50% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

    .carousel-dots-indicator {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot-node {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      transition: all 0.2s ease;
    }

    .dot-node.active {
      background: var(--accent-blue);
      width: 8px;
      height: 8px;
    }

    /* LIKES & CAPTION */
    .post-details {
      padding: 0 16px 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .likes-count-row {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .likes-avatars {
      display: flex;
      align-items: center;
      margin-right: 4px;
    }
    .likes-avatars img {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid var(--card-bg);
      margin-left: -6px;
    }
    .likes-avatars img:first-child { margin-left: 0; }

    .caption-box {
      font-size: 0.86rem;
      color: var(--text-main);
      line-height: 1.45;
      word-break: break-word;
    }

    .caption-author {
      font-weight: 700;
      margin-right: 6px;
    }

    .caption-tag {
      color: #4da6ff;
      cursor: pointer;
    }

    .comments-view-link {
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      margin-top: 2px;
    }

    .post-time-ago {
      font-size: 0.68rem;
      color: var(--text-subtle);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 2px;
    }

    /* BOTTOM NAV BAR */
    .bottom-nav-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 480px;
      height: var(--nav-height);
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      z-index: 100;
    }

    @media (min-width: 1024px) {
      .bottom-nav-bar { max-width: 620px; }
    }

    .nav-tab-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.35rem;
      width: 50px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .nav-tab-item.active {
      color: var(--text-main);
    }

    .nav-tab-item:active {
      transform: scale(0.88);
    }

    .profile-nav-avatar {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      object-fit: cover;
      border: 1.5px solid transparent;
    }

    .nav-tab-item.active .profile-nav-avatar {
      border-color: var(--text-main);
    }

    /* FULLSCREEN STORY PLAYER MODAL */
    .story-viewer-modal {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 200;
      display: none;
      flex-direction: column;
      justify-content: space-between;
    }

    .story-viewer-modal.active {
      display: flex;
    }

    .story-progress-bar-container {
      position: absolute;
      top: 12px;
      left: 10px;
      right: 10px;
      display: flex;
      gap: 4px;
      z-index: 10;
    }

    .progress-track {
      flex: 1;
      height: 2.5px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
    }

    .story-viewer-header {
      position: absolute;
      top: 24px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .story-user-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .story-user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .story-user-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }

    .story-time-badge {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.7);
    }

    .story-close-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.2rem;
      padding: 8px;
      cursor: pointer;
    }

    .story-media-content {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .story-media-content img,
    .story-media-content video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Touch Zones for Rewind / Advance */
    .story-touch-zone {
      position: absolute;
      top: 60px;
      bottom: 80px;
      width: 35%;
      z-index: 5;
    }

    .story-touch-left { left: 0; }
    .story-touch-right { right: 0; width: 65%; }

    .story-footer-input-row {
      position: absolute;
      bottom: 16px;
      left: 12px;
      right: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .story-reply-input {
      flex: 1;
      height: 44px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--radius-full);
      padding: 0 16px;
      color: #fff;
      font-size: 0.88rem;
      outline: none;
    }

    .story-reply-input::placeholder { color: rgba(255,255,255,0.7); }

    /* CREATE POST MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(12px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: #12141d;
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .modal-header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border-glass);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .form-input {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 10px 14px;
      color: #fff;
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent-blue);
    }

    .primary-btn {
      background: var(--accent-gradient);
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      margin-top: 8px;
    }

    .primary-btn:active { transform: scale(0.98); }
  </style>
</head>
<body>

  <div class="app-viewport">
    
    <!-- TOP HEADER BAR -->
    <header class="top-bar">
      <div class="brand-logo">
        <i class="fa-brands fa-instagram"></i>
        <span>OmniMedia</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openComposerModal()" title="Create Post">
          <i class="fa-regular fa-square-plus"></i>
        </button>
        <button class="icon-btn" title="Notifications">
          <i class="fa-regular fa-heart"></i>
          <span class="badge-dot"></span>
        </button>
        <button class="icon-btn" title="Messages">
          <i class="fa-regular fa-paper-plane"></i>
        </button>
      </div>
    </header>

    <!-- STORIES HORIZONTAL TRAY -->
    <section class="stories-container">
      <div class="stories-wrapper" id="storiesWrapper">
        <!-- Story Items injected dynamically -->
      </div>
    </section>

    <!-- FEED CONTAINER -->
    <main class="feed-container" id="feedContainer">
      <!-- Posts injected dynamically -->
    </main>

    <!-- BOTTOM NAVIGATION BAR -->
    <nav class="bottom-nav-bar">
      <button class="nav-tab-item active" title="Home">
        <i class="fa-solid fa-house"></i>
      </button>
      <button class="nav-tab-item" title="Search">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
      <button class="nav-tab-item" onclick="openComposerModal()" title="Create">
        <i class="fa-regular fa-square-plus" style="font-size: 1.5rem;"></i>
      </button>
      <button class="nav-tab-item" title="Reels">
        <i class="fa-solid fa-clapperboard"></i>
      </button>
      <button class="nav-tab-item" title="Profile">
        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" class="profile-nav-avatar" alt="Profile">
      </button>
    </nav>

  </div>

  <!-- FULLSCREEN STORY PLAYER MODAL -->
  <div class="story-viewer-modal" id="storyModal">
    <div class="story-progress-bar-container" id="storyProgressContainer"></div>
    <div class="story-viewer-header">
      <div class="story-user-meta">
        <img src="" id="storyUserAvatar" class="story-user-avatar" alt="">
        <span id="storyUsername" class="story-user-name">username</span>
        <span id="storyTime" class="story-time-badge">2h</span>
      </div>
      <button class="story-close-btn" onclick="closeStoryModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="story-media-content" id="storyMediaBox">
      <!-- Media inserted dynamically -->
    </div>

    <!-- Touch Navigation Areas -->
    <div class="story-touch-zone story-touch-left" onclick="prevStory()"></div>
    <div class="story-touch-zone story-touch-right" onclick="nextStory()"></div>

    <div class="story-footer-input-row">
      <input type="text" class="story-reply-input" placeholder="Send message...">
      <button class="action-icon-btn" style="color:#fff;"><i class="fa-regular fa-heart"></i></button>
      <button class="action-icon-btn" style="color:#fff;"><i class="fa-regular fa-paper-plane"></i></button>
    </div>
  </div>

  <!-- CREATE MULTI-SLIDE POST MODAL -->
  <div class="modal-overlay" id="composerModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>Create New Post</span>
        <i class="fa-solid fa-xmark" style="cursor:pointer;" onclick="closeComposerModal()"></i>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label>Media URLs (Comma-separated for slideshow)</label>
          <input type="text" id="inputMediaUrls" class="form-input" placeholder="https://image1.jpg, https://image2.jpg">
        </div>
        <div class="form-group">
          <label>Caption</label>
          <input type="text" id="inputCaption" class="form-input" placeholder="Write a caption...">
        </div>
        <div class="form-group">
          <label>Location Tag</label>
          <input type="text" id="inputLocation" class="form-input" placeholder="e.g. Tokyo, Japan">
        </div>
        <div class="form-group">
          <label>Music Track</label>
          <input type="text" id="inputMusic" class="form-input" placeholder="e.g. Travis Scott • FE!N">
        </div>
        <button class="primary-btn" onclick="publishNewPost()">Share Post</button>
      </div>
    </div>
  </div>

  <script>
    // INITIAL MOCK DATA
    const mockStories = [
      { id: 1, name: 'Your Story', avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150', isMyStory: true, seen: false, media: 'https://images.unsplash.com/photo-1517841905240-472988babdf9?w=800' },
      { id: 2, name: 'alex_cyber', avatar: 'https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150', seen: false, media: 'https://images.unsplash.com/photo-1515260268569-9271009adfdb?w=800' },
      { id: 3, name: 'sara.tokyo', avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150', seen: false, media: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=800' },
      { id: 4, name: 'drift_king', avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150', seen: false, media: 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=800' },
      { id: 5, name: 'future_beats', avatar: 'https://images.unsplash.com/photo-1522075469751-3a6694fb2f61?w=150', seen: true, media: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=800' }
    ];

    let mockPosts = [
      {
        id: 101,
        author: {
          username: 'sara.tokyo',
          avatar: 'https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150',
          verified: true
        },
        location: 'Shibuya, Tokyo',
        music: 'Ken Carson • Overseas',
        media: [
          { type: 'image', url: 'https://images.unsplash.com/photo-1503899036084-c55cdd92da26?w=800' },
          { type: 'image', url: 'https://images.unsplash.com/photo-1542051841857-5f90071e7989?w=800' },
          { type: 'image', url: 'https://images.unsplash.com/photo-1515260268569-9271009adfdb?w=800' }
        ],
        likes: 14230,
        liked: false,
        caption: 'Night walks under the neon lights ⛩️✨ swipe to see the full aesthetic',
        commentsCount: 284,
        timeAgo: '2 hours ago'
      },
      {
        id: 102,
        author: {
          username: 'drift_king',
          avatar: 'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150',
          verified: false
        },
        location: 'Akihabara, Japan',
        music: 'Playboi Carti • Timeless',
        media: [
          { type: 'image', url: 'https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=800' },
          { type: 'image', url: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=800' }
        ],
        likes: 8920,
        liked: true,
        caption: 'Late night build test run. What color should I wrap it next? 🏎️💨',
        commentsCount: 112,
        timeAgo: '5 hours ago'
      }
    ];

    // RENDER STORIES
    function renderStories() {
      const wrapper = document.getElementById('storiesWrapper');
      wrapper.innerHTML = mockStories.map((story, index) => `
        <div class="story-item" onclick="openStoryModal(${index})">
          <div class="story-ring ${story.seen ? 'seen' : ''} ${story.isMyStory ? 'my-story' : ''}">
            <img src="${story.avatar}" class="story-avatar" alt="${story.name}">
            ${story.isMyStory ? '<div class="add-story-plus"><i class="fa-solid fa-plus"></i></div>' : ''}
          </div>
          <span class="story-username">${story.name}</span>
        </div>
      `).join('');
    }

    // RENDER FEED POSTS
    function renderPosts() {
      const container = document.getElementById('feedContainer');
      container.innerHTML = mockPosts.map(post => {
        const isMulti = post.media.length > 1;

        return `
          <article class="post-card" id="post-${post.id}">
            <!-- Header -->
            <header class="post-header">
              <div class="post-author-info">
                <div class="author-avatar-ring">
                  <img src="${post.author.avatar}" class="author-avatar" alt="${post.author.username}">
                </div>
                <div class="author-details">
                  <div class="author-name-row">
                    <span class="author-username">${post.author.username}</span>
                    ${post.author.verified ? '<i class="fa-solid fa-circle-check verified-badge"></i>' : ''}
                  </div>
                  <div class="post-sub-info">
                    ${post.location ? `<span>📍 ${post.location}</span>` : ''}
                    ${post.music ? `
                      <div class="pill-badge">
                        <div class="soundwave-icon"><span></span><span></span><span></span></div>
                        <span>${post.music}</span>
                      </div>
                    ` : ''}
                  </div>
                </div>
              </div>
              <button class="action-icon-btn" style="font-size: 1rem;"><i class="fa-solid fa-ellipsis"></i></button>
            </header>

            <!-- Media Carousel with Touch/Swipe -->
            <div class="media-viewport" onwheel="handleCarouselWheel(event, ${post.id})">
              <div class="heart-burst" id="burst-${post.id}">
                <i class="fa-solid fa-heart"></i>
              </div>

              ${isMulti ? `<div class="carousel-count-badge" id="badge-${post.id}">1/${post.media.length}</div>` : ''}

              <div class="media-slider" id="slider-${post.id}" onscroll="updateCarouselIndicators(${post.id}, ${post.media.length})">
                ${post.media.map(m => `
                  <div class="media-slide" ondblclick="triggerDoubleTapLike(${post.id})">
                    <img src="${m.url}" loading="lazy" alt="Post media">
                  </div>
                `).join('')}
              </div>
            </div>

            <!-- Post Actions -->
            <div class="post-actions">
              <div class="left-actions">
                <button class="action-icon-btn ${post.liked ? 'liked' : ''}" id="like-btn-${post.id}" onclick="toggleLike(${post.id})">
                  <i class="${post.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>
                </button>
                <button class="action-icon-btn"><i class="fa-regular fa-comment"></i></button>
                <button class="action-icon-btn"><i class="fa-regular fa-paper-plane"></i></button>
              </div>

              ${isMulti ? `
                <div class="carousel-dots-indicator" id="dots-${post.id}">
                  ${post.media.map((_, i) => `<div class="dot-node ${i === 0 ? 'active' : ''}"></div>`).join('')}
                </div>
              ` : ''}

              <button class="action-icon-btn"><i class="fa-regular fa-bookmark"></i></button>
            </div>

            <!-- Likes & Caption -->
            <div class="post-details">
              <div class="likes-count-row">
                <div class="likes-avatars">
                  <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100">
                  <img src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=100">
                </div>
                <span id="likes-count-${post.id}">${post.likes.toLocaleString()} likes</span>
              </div>

              <div class="caption-box">
                <span class="caption-author">${post.author.username}</span>
                <span>${post.caption}</span>
              </div>

              <div class="comments-view-link">
                View all ${post.commentsCount} comments
              </div>

              <div class="post-time-ago">${post.timeAgo}</div>
            </div>
          </article>
        `;
      }).join('');
    }

    // CAROUSEL SWIPE & SCROLL INDICATOR UPDATES
    function updateCarouselIndicators(postId, totalSlides) {
      const slider = document.getElementById(`slider-${postId}`);
      if (!slider) return;

      const scrollLeft = slider.scrollLeft;
      const slideWidth = slider.clientWidth;
      const currentIndex = Math.round(scrollLeft / slideWidth);

      // Update counter badge
      const badge = document.getElementById(`badge-${postId}`);
      if (badge) badge.innerText = `${currentIndex + 1}/${totalSlides}`;

      // Update dot nodes
      const dotsContainer = document.getElementById(`dots-${postId}`);
      if (dotsContainer) {
        const dots = dotsContainer.querySelectorAll('.dot-node');
        dots.forEach((dot, idx) => {
          if (idx === currentIndex) dot.classList.add('active');
          else dot.classList.remove('active');
        });
      }
    }

    // DOUBLE TAP TO LIKE
    function triggerDoubleTapLike(postId) {
      const post = mockPosts.find(p => p.id === postId);
      if (!post) return;

      // Animate heart
      const burst = document.getElementById(`burst-${postId}`);
      if (burst) {
        burst.classList.remove('animate');
        void burst.offsetWidth; // Trigger reflow
        burst.classList.add('animate');
      }

      if (!post.liked) {
        toggleLike(postId);
      }
    }

    // TOGGLE LIKE STATE
    function toggleLike(postId) {
      const post = mockPosts.find(p => p.id === postId);
      if (!post) return;

      post.liked = !post.liked;
      post.likes += post.liked ? 1 : -1;

      const likeBtn = document.getElementById(`like-btn-${postId}`);
      const likesCount = document.getElementById(`likes-count-${postId}`);

      if (likeBtn) {
        likeBtn.className = `action-icon-btn ${post.liked ? 'liked' : ''}`;
        likeBtn.innerHTML = `<i class="${post.liked ? 'fa-solid fa-heart' : 'fa-regular fa-heart'}"></i>`;
      }

      if (likesCount) {
        likesCount.innerText = `${post.likes.toLocaleString()} likes`;
      }
    }

    // STORY PLAYER MODAL LOGIC
    let activeStoryIndex = 0;
    let storyTimer = null;

    function openStoryModal(index) {
      activeStoryIndex = index;
      const story = mockStories[activeStoryIndex];
      story.seen = true;
      renderStories();

      const modal = document.getElementById('storyModal');
      modal.classList.add('active');

      document.getElementById('storyUserAvatar').src = story.avatar;
      document.getElementById('storyUsername').innerText = story.name;
      document.getElementById('storyMediaBox').innerHTML = `<img src="${story.media}" alt="Story">`;

      // Setup Progress Tracks
      const progressContainer = document.getElementById('storyProgressContainer');
      progressContainer.innerHTML = mockStories.map((_, i) => `
        <div class="progress-track">
          <div class="progress-fill" id="pfill-${i}"></div>
        </div>
      `).join('');

      startStoryProgress();
    }

    function startStoryProgress() {
      clearInterval(storyTimer);
      
      // Reset all tracks
      mockStories.forEach((_, i) => {
        const fill = document.getElementById(`pfill-${i}`);
        if (fill) {
          if (i < activeStoryIndex) fill.style.width = '100%';
          else fill.style.width = '0%';
        }
      });

      let progress = 0;
      const currentFill = document.getElementById(`pfill-${activeStoryIndex}`);

      storyTimer = setInterval(() => {
        progress += 2;
        if (currentFill) currentFill.style.width = `${progress}%`;

        if (progress >= 100) {
          clearInterval(storyTimer);
          nextStory();
        }
      }, 100);
    }

    function nextStory() {
      if (activeStoryIndex < mockStories.length - 1) {
        openStoryModal(activeStoryIndex + 1);
      } else {
        closeStoryModal();
      }
    }

    function prevStory() {
      if (activeStoryIndex > 0) {
        openStoryModal(activeStoryIndex - 1);
      } else {
        startStoryProgress();
      }
    }

    function closeStoryModal() {
      clearInterval(storyTimer);
      document.getElementById('storyModal').classList.remove('active');
    }

    // COMPOSER MODAL
    function openComposerModal() {
      document.getElementById('composerModal').classList.add('active');
    }

    function closeComposerModal() {
      document.getElementById('composerModal').classList.remove('active');
    }

    function publishNewPost() {
      const urlsInput = document.getElementById('inputMediaUrls').value.trim();
      const caption = document.getElementById('inputCaption').value.trim();
      const location = document.getElementById('inputLocation').value.trim();
      const music = document.getElementById('inputMusic').value.trim();

      if (!urlsInput) {
        alert('Please enter at least one media image URL');
        return;
      }

      const mediaArr = urlsInput.split(',').map(url => ({ type: 'image', url: url.trim() }));

      const newPost = {
        id: Date.now(),
        author: {
          username: 'my_profile',
          avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
          verified: true
        },
        location: location || 'Fort Worth, TX',
        music: music || 'Travis Scott • FE!N',
        media: mediaArr,
        likes: 1,
        liked: true,
        caption: caption || 'New post update! 🔥',
        commentsCount: 0,
        timeAgo: 'Just now'
      };

      mockPosts.unshift(newPost);
      renderPosts();
      closeComposerModal();

      // Clear form
      document.getElementById('inputMediaUrls').value = '';
      document.getElementById('inputCaption').value = '';
      document.getElementById('inputLocation').value = '';
      document.getElementById('inputMusic').value = '';
    }

    // INITIALIZE
    document.addEventListener('DOMContentLoaded', () => {
      renderStories();
      renderPosts();
    });
  </script>
</body>
</html>
